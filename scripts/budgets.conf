# The one place usage budgets are defined. Sourced by scripts/usage.sh; nothing
# else may hardcode a ceiling. Deliberately NOT in LOOP_STATE.md: that file is
# model-facing narrative rewritten by every loop iteration, and a budget is not
# something a run should be able to edit by accident.
#
# TWO ceilings, and only the gate pair is stated — the kill pair is DERIVED below.
#
#   gate  — "may a new run start?"  asked once, before spending anything.
#   kill  — "must the run in flight be terminated?"  asked every 60s by the
#           watchdog in run-once.sh.
#
# The gate admits a run when `used + burn < ceiling`, i.e. it has already budgeted
# for the run to finish as high as the ceiling. So a kill ceiling BELOW the gate
# ceiling contradicts the gate's own promise and kills runs it just admitted. That
# is not hypothetical: it is the 2026-07-26 incident, where kill_week (58) sat
# below the gate's effective launch point (65) and every launch in that 7-point
# band died at its first 60s tick. Deriving the kill pair makes that unrepresentable.
#
# The watchdog's job is to catch a run burning MORE than the gate budgeted for it
# (2026-07-21: launch-time-only gating let one run take the 5h window to 99%),
# so it fires at the gate ceiling plus a small overshoot margin.

GATE_SESSION=85          # 5-hour window, shared across models
GATE_WEEK=90             # aggregate weekly tank
KILL_MARGIN=5            # overshoot tolerated past the gate ceiling before a kill

# Headroom the gate reserves for the run it is about to admit. PER TANK, because
# a run costs the two tanks wildly different amounts — one buffer for both was
# reserving ~10x the real cost on the weekly side and stranding launches for it.
# Measured 2026-07-26 across consecutive runs: a ~90-minute iteration moves the
# 5-hour meter ~25-30 points (32% -> 58-61% observed) but the weekly meter only
# ~2-3 points (53 -> 56 -> 58). Re-measure these if run length changes materially.
BURN_SESSION=25
BURN_WEEK=5

# Derived (see scripts/usage.sh — do not restate these anywhere):
#   KILL_SESSION = GATE_SESSION + KILL_MARGIN = 90
#   KILL_WEEK    = GATE_WEEK    + KILL_MARGIN = 95
#
# Invariants asserted by scripts/selftest-budgets.sh, which the console runs at
# startup so a bad edit fails in 1s rather than 60s into a burned run:
#   KILL_* >= GATE_*             (never kill a run the gate admitted)
#   KILL_* >  GATE_* - BURN_*    (no birth-dead launch window, per tank)
#   KILL_* <  100                (a ceiling at the hard cap can never fire)
